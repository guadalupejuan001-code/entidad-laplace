plugins { id 'com.android.application' }
android {
    namespace 'com.entidadlaplace.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.entidadlaplace.mobile'
        minSdk 26
        targetSdk 34
        versionCode 24
        versionName '4.9.0-Registro-Automatico'
    }
    defaultConfig {
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.learn49' }
        release { minifyEnabled false }
    }
    testOptions {
        unitTests.all {
            systemProperty 'laplace.repo', rootProject.file('../..').absolutePath
            systemProperty 'java.library.path', rootProject.file('../../build/lqt-host-jni').absolutePath
        }
    }
    dependencies {
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        implementation 'net.i2p.crypto:eddsa:0.3.0'
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.json:json:20240303'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
