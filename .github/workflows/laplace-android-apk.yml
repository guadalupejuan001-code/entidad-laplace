name: LAPLACE Android 3.4 - XN01 F001 y auditoría de 20 grupos
on:
  push:
    branches: [feature/laplace-android-standalone-multihorizon-20261031, main]
    paths:
      - 'apps/laplace-android/**'
      - '.github/workflows/laplace-android-apk.yml'
  pull_request:
    paths:
      - 'apps/laplace-android/**'
      - '.github/workflows/laplace-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-laplace-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: laplace-archivo
          path: world_archive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: laplace-modelos
          path: model_archive
          persist-credentials: false
      # Compile ORIGINAL XI/Ether from exact reviewed, pinned dependency.
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: 45f7230bb6383f383c3bbea543f6199563f7cd32
          path: deps/reverse-pc
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Comprobar Android SDK 35 en runner
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          ls "$SDK"/platforms/ || true
          if [ ! -e "$SDK/platforms/android-35/android.jar" ] || [ ! -x "$SDK/build-tools/35.0.0/apksigner" ]; then
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -e "$SDK/platforms/android-35/android.jar"
      - name: Instalar dependencias del núcleo de Laplace
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pruebas de modelo y contratos de la interfaz
        run: |
          set -euo pipefail
          node apps/laplace-android/build-integral-assets.mjs --verify
          node --test apps/laplace-android/tests/*.test.cjs
          node --test tests/laplace-financiero.test.mjs tests/registro-capacidades.test.mjs tests/laplace-integral.test.mjs tests/resumen-fuentes.test.mjs
          node --check apps/laplace-android/app/src/main/assets/live-feed.js
          # El ejecutor integral se prueba con npm ci en laplace-integral-v3.yml.
      - name: Incluir última captura financiera EF002 con verificación de hashes
        run: |
          set -euo pipefail
          node apps/laplace-android/prepare-world.mjs world_archive/capturas model_archive/reportes
      - name: Verificar que el archivo EF002 contiene estados auténticos
        run: |
          node --input-type=module -e '
            import{readFileSync}from "node:fs";
            import assert from "node:assert/strict";
            const src=readFileSync("apps/laplace-android/app/src/main/assets/world.js","utf8");
            const body=src.replace(/^window.LAPLACE_WORLD = /,"").trim().replace(/;$/,"");
            const w=JSON.parse(body);
            assert.equal(w.states_count,w.states.length);
            assert.ok(w.states_count>0);
            assert.ok(w.states.every(s=>s.id&&s.known_at&&s.observed_at&&s.source_url));
            assert.equal(w.forecast_model_uses_world,false);
            assert.equal(w.automatic_trading,false);
            assert.equal(w.archive_manifests_count,w.history.length);
            assert.equal(w.history_index_complete,true);
            assert.equal(w.state_history_on_device,false);
            assert.equal(w.ef004_report?.verification,"real_archives_only_not_synthetic");
            assert.equal(w.ef004_report?.status,"abstained");
            assert.equal(w.ef004_report?.archive_count,undefined);
            assert.equal(w.ef004_report?.model_ready,false);
            const swaps=w.groups.find(x=>x.group==="swaps_otc_d002");
            const sources=w.source_summary.find(x=>x.group==="swaps_otc_d002");
            if(swaps?.signals>0){
              assert.ok(sources);
              assert.equal(sources.signal_count,swaps.signals,
                "El resumen no puede ocultar estados CFTC realmente observados");
            }
            console.log("EF002:",w.states_count,"estados,",w.archive_manifests_count,"archivos.");
          '
      - name: Prueba de interacción real de todos los controles en Chromium
        run: |
          set -euo pipefail
          node --check apps/laplace-android/app/src/main/assets/app.js
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1
          node apps/laplace-android/tests/browser-smoke.cjs
      - name: Verificar ejecutor XI auténtico, paridad de plantilla y overlay Ether
        run: |
          set -euo pipefail
          test "$(git -C deps/mundo-x rev-parse HEAD)" = e2778d962af22f6f1a0794058dd4685fc2573966
          test "$(git -C deps/reverse-pc rev-parse HEAD)" = 45f7230bb6383f383c3bbea543f6199563f7cd32
          cmp apps/laplace-android/app/src/main/assets/xn01-native.xi deps/reverse-pc/reverse-os-android/app/src/main/assets/laplace/x001-native.xi
          sed 's/package com.reversepc.os;/package com.entidadlaplace.mobile;/' deps/reverse-pc/reverse-os-android/app/src/main/java/com/reversepc/os/LaplaceXiCompiler.java > /tmp/LaplaceXiCompiler-pin.java
          cmp /tmp/LaplaceXiCompiler-pin.java apps/laplace-android/app/src/main/java/com/entidadlaplace/mobile/LaplaceXiCompiler.java
          python3 deps/reverse-pc/scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          test -f build/ether-compat/mundo_x/quantum_runtime.hpp
          test -f apps/laplace-android/app/src/main/cpp/native_xn01_jni.cpp
      - name: Probar protocolo WebSocket nativo con JUnit
        run: |
          set -euo pipefail
          gradle -p apps/laplace-android :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compilar APK de Android con firma de depuración
        run: |
          set -euo pipefail
          gradle -p apps/laplace-android :app:assembleDebug --no-daemon --stacktrace
      - name: Verificar APK real, firma y paquete
        run: |
          set -euo pipefail
          APK=apps/laplace-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/math-pde.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/pde-panel.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/engine.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/index.html'
          unzip -Z1 "$APK" | grep -Fx 'assets/world.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/fusion-integral.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/live-feed.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/xn01-native.xi'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/liblaplace_xi.so'
          unzip -Z1 "$APK" | grep -Fx 'assets/xn01-native.xi'
          unzip -Z1 "$APK" | grep -Fx 'classes.dex'
          unzip -t "$APK" > /tmp/laplace-apk-validation.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -12
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: LAPLACE-ANDROID-V3-4-20-MODULOS-AUDITADOS
          path: apps/laplace-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
