name: LAPLACE Android 3.9 - Herramienta y registro detallado
on:
  push:
    branches: [feature/laplace-android-standalone-multihorizon-20261031, main]
    paths:
      - 'apps/laplace-android/**'
      - 'prediccion/conjunta-f002.mjs'
      - 'tools/conjunta-f002.mjs'
      - 'experimentos/marea-m003.mjs'
      - 'apps/laplace-android/app/src/main/assets/regime-m004.js'
      - '.github/workflows/laplace-android-apk.yml'
  pull_request:
    paths:
      - 'apps/laplace-android/**'
      - 'prediccion/conjunta-f002.mjs'
      - 'tools/conjunta-f002.mjs'
      - 'experimentos/marea-m003.mjs'
      - 'apps/laplace-android/app/src/main/assets/regime-m004.js'
      - '.github/workflows/laplace-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-laplace-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: laplace-archivo
          path: world_archive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: laplace-modelos
          path: model_archive
          persist-credentials: false
      # Compile ORIGINAL XI/Ether from exact reviewed, pinned dependency.
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: 45f7230bb6383f383c3bbea543f6199563f7cd32
          path: deps/reverse-pc
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Comprobar Android SDK 35 en runner
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          ls "$SDK"/platforms/ || true
          if [ ! -e "$SDK/platforms/android-35/android.jar" ] || [ ! -x "$SDK/build-tools/35.0.0/apksigner" ]; then
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -e "$SDK/platforms/android-35/android.jar"
      - name: Instalar dependencias del núcleo de Laplace
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pruebas de modelo y contratos de la interfaz
        run: |
          set -euo pipefail
          node apps/laplace-android/build-integral-assets.mjs --verify
          node --test apps/laplace-android/tests/*.test.cjs
          node --test tests/marea-m003.test.mjs
          node --test apps/laplace-android/tests/regime-m004.test.cjs
          node --test tests/laplace-financiero.test.mjs tests/registro-capacidades.test.mjs tests/laplace-integral.test.mjs tests/resumen-fuentes.test.mjs tests/conjunta-f002.test.mjs
          node --check apps/laplace-android/app/src/main/assets/live-feed.js
          # El ejecutor integral se prueba con npm ci en laplace-integral-v3.yml.
      - name: F002 · ejecutar predictor conjunto verificable sobre archivo verdadero
        env:
          LAPLACE_F002_INCLUDE_LEGACY: 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f002-build"
          node tools/conjunta-f002.mjs ejecutar world_archive/capturas "$RUNNER_TEMP/f002-build" model_archive > "$RUNNER_TEMP/f002-build/run.json"
      - name: Incluir última captura financiera EF002 y estado F002
        run: |
          set -euo pipefail
          node apps/laplace-android/prepare-world.mjs world_archive/capturas model_archive/reportes "$RUNNER_TEMP/f002-build/informes-f002"
      - name: Verificar que el archivo EF002 contiene estados auténticos
        run: |
          node --input-type=module -e '
            import{readFileSync}from "node:fs";
            import assert from "node:assert/strict";
            const src=readFileSync("apps/laplace-android/app/src/main/assets/world.js","utf8");
            const body=src.replace(/^window.LAPLACE_WORLD = /,"").trim().replace(/;$/,"");
            const w=JSON.parse(body);
            assert.equal(w.states_count,w.states.length);
            assert.ok(w.states_count>0);
            assert.ok(w.states.every(s=>s.id&&s.known_at&&s.observed_at&&s.source_url));
            assert.equal(w.forecast_model_uses_world,false);
            assert.equal(w.automatic_trading,false);
            assert.equal(w.archive_manifests_count,w.history.length);
            assert.equal(w.history_index_complete,true);
            assert.equal(w.state_history_on_device,false);
            assert.equal(w.ef004_report?.verification,"real_archives_only_not_synthetic");
            assert.ok(["abstained","experimental_model_frozen"].includes(w.ef004_report?.status));
            assert.equal(w.ef004_report?.archive_count,undefined);
            assert.ok(["abstained","experimental_model_frozen"].includes(w.ef004_report?.status));
            assert.equal(w.f002_report?.schema,"laplace-f002-joint-archive-v1");
            assert.equal(w.f002_report?.capture_sha256,w.capture_sha256);
            assert.equal(w.f002_report?.archive_manifests_verified,w.archive_manifests_count);
            assert.equal(w.f002_report?.archive_count,
              w.archive_manifests_count+w.f002_report?.supplemental_evidence_verified);
            assert.equal(w.f002_report?.automatic_trading,false);
            assert.equal(w.f002_report?.production_activation_allowed,false);
            assert.equal(w.f002_report?.central_f001_price_modified,false);
            assert.ok(w.f002_report?.source_series>=0);
            const swaps=w.groups.find(x=>x.group==="swaps_otc_d002");
            const sources=w.source_summary.find(x=>x.group==="swaps_otc_d002");
            if(swaps?.signals>0){
              assert.ok(sources);
              assert.equal(sources.signal_count,swaps.signals,
                "El resumen no puede ocultar estados CFTC realmente observados");
            }
            console.log("EF002:",w.states_count,"estados,",w.archive_manifests_count,"archivos.");
          '
      - name: Incorporar investigación M003 real (NO predicción en vivo)
        run: |
          set -euo pipefail
          node apps/laplace-android/prepare-marea.mjs
          node --input-type=module -e '
            import{readFileSync}from"node:fs";
            import assert from"node:assert/strict";
            const t=readFileSync("apps/laplace-android/app/src/main/assets/marea.js","utf8");
            const m=JSON.parse(t.replace(/^window.LAPLACE_MAREA = /,"").trim().replace(/;$/,""));
            assert.equal(m.history_bars,7488);
            assert.equal(m.study.length,3);
            assert.equal(m.prospective_validation,false);
            assert.equal(m.changes_f001_or_m001,false);
            assert.ok(m.study.every(x=>x.status==="no_reproducible_edge_detected"));
          '
      - name: Incorporar estados M004 sobre archivo X002 auténtico
        run: |
          set -euo pipefail
          node apps/laplace-android/prepare-regime.mjs
          node --input-type=module -e '
            import{readFileSync}from"node:fs";
            import assert from"node:assert/strict";
            const t=readFileSync("apps/laplace-android/app/src/main/assets/m004-evidence.js","utf8");
            const m=JSON.parse(t.replace(/^window.LAPLACE_M004_EVIDENCE = /,"").trim().replace(/;$/,""));
            assert.equal(m.schema,"laplace-m004-android-retrospective-v1");
            assert.equal(m.source.bars,7488);
            assert.equal(m.horizons.length,3);
            assert.ok(m.horizons.every(x=>x.test_cases>0));
            assert.equal(m.prospectively_validated,false);
            assert.equal(m.can_generate_production_price,false);
            assert.equal(m.automatic_trading,false);
            console.log(JSON.stringify(m.horizons));
          '
      - name: Prueba de interacción real de todos los controles en Chromium
        run: |
          set -euo pipefail
          node --check apps/laplace-android/app/src/main/assets/app.js
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1
          node apps/laplace-android/tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LAPLACE-3-9-PREVIEWS-SIMULADAS
          path: apps/laplace-android/build/ux-previews/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Verificar ejecutor XI auténtico, paridad de plantilla y overlay Ether
        run: |
          set -euo pipefail
          test "$(git -C deps/mundo-x rev-parse HEAD)" = e2778d962af22f6f1a0794058dd4685fc2573966
          test "$(git -C deps/reverse-pc rev-parse HEAD)" = 45f7230bb6383f383c3bbea543f6199563f7cd32
          cmp apps/laplace-android/app/src/main/assets/xn01-native.xi deps/reverse-pc/reverse-os-android/app/src/main/assets/laplace/x001-native.xi
          sed 's/package com.reversepc.os;/package com.entidadlaplace.mobile;/' deps/reverse-pc/reverse-os-android/app/src/main/java/com/reversepc/os/LaplaceXiCompiler.java > /tmp/LaplaceXiCompiler-pin.java
          cmp /tmp/LaplaceXiCompiler-pin.java apps/laplace-android/app/src/main/java/com/entidadlaplace/mobile/LaplaceXiCompiler.java
          python3 deps/reverse-pc/scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          test -f build/ether-compat/mundo_x/quantum_runtime.hpp
          test -f apps/laplace-android/app/src/main/cpp/native_xn01_jni.cpp
      - name: Probar protocolo WebSocket nativo con JUnit
        run: |
          set -euo pipefail
          gradle -p apps/laplace-android :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compilar APK de Android con firma de depuración
        run: |
          set -euo pipefail
          gradle -p apps/laplace-android :app:assembleDebug --no-daemon --stacktrace
      - name: Verificar APK real, firma y paquete
        run: |
          set -euo pipefail
          APK=apps/laplace-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/math-pde.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/pde-panel.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/engine.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/index.html'
          unzip -Z1 "$APK" | grep -Fx 'assets/world.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/fusion-integral.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/live-feed.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/regime-m004.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/m004-evidence.js'
          unzip -Z1 "$APK" | grep -Fx 'assets/xn01-native.xi'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/liblaplace_xi.so'
          unzip -Z1 "$APK" | grep -Fx 'assets/xn01-native.xi'
          unzip -Z1 "$APK" | grep -Fx 'classes.dex'
          unzip -t "$APK" > /tmp/laplace-apk-validation.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/laplace-badging.txt
          grep -F "package: name='com.entidadlaplace.mobile.tool39'" /tmp/laplace-badging.txt
          grep -F "launchable-activity: name='com.entidadlaplace.mobile.MainActivity'" /tmp/laplace-badging.txt
          grep -F "label='LAPLACE 3.9'" /tmp/laplace-badging.txt
          head -12 /tmp/laplace-badging.txt
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: LAPLACE-ANDROID-V3-9-HERRAMIENTA-RESULTADOS
          path: apps/laplace-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
