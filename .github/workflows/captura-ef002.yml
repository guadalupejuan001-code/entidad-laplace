name: Entidad Laplace EF002 - Captura financiera publica periodica
on:
  schedule:
    - cron: '23 4,10,16,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/captura-ef002.yml'
      - 'estado-financiero/captura.mjs'
      - 'tools/ciclo-financiero.mjs'
permissions:
  contents: write
concurrency:
  group: laplace-ef002-archive-public
  cancel-in-progress: false
jobs:
  capture-public-financial-world:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias fijadas
        run: npm ci --no-audit --no-fund
      - name: Pruebas minimas del importador antes de operar
        run: |
          set -euo pipefail
          npm run test:ef002
          npm run test:ef003
      - name: Capturar fuentes publicas U003 + D001/D002/B001/K001 y SEC si autorizada
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ef002"
          node tools/ciclo-financiero.mjs capturar \
            "$RUNNER_TEMP/ef002/archivo" "$RUNNER_TEMP/ef002/postgres" \
            > "$RUNNER_TEMP/ef002/resumen.json"
          node --input-type=module -e '
            import{readFileSync}from"node:fs";
            import assert from"node:assert/strict";
            const x=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/ef002/resumen.json","utf8"));
            assert.ok(x.cycle.states_observed>0,"No afirmar captura vacía exitosa");
            assert.equal(x.cycle.automatic_trading,false);
            assert.equal(x.archive.contains_public_data_only,true);
            console.log(JSON.stringify({captured_at:x.cycle.captured_at,
              states:x.cycle.states_observed,
              groups:x.cycle.additional_financial_groups,
              sources:x.cycle.source_summary.map(g=>({group:g.group,ok:g.observed_sources,
                failures:g.failed_sources,restricted:g.restricted_sources})),
              manifest:x.archive.relative_payload,
              archive_sha256:x.archive.archive_sha256}));
          '
      - name: Guardar copia en artefacto de Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laplace-ef002-captura-publica
          path: ${{ runner.temp }}/ef002/archivo/
          retention-days: 30
          if-no-files-found: warn
      - name: Publicar archivo historico inmutable en rama separada
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git ls-remote --exit-code --heads origin laplace-archivo > /dev/null; then
            git fetch origin refs/heads/laplace-archivo:refs/remotes/origin/laplace-archivo
            git switch -c laplace-archivo --track origin/laplace-archivo
          else
            git switch --orphan laplace-archivo
            git rm -rf --quiet . || true
            printf '%s\n' '# Laplace - archivo publico EF002' \
              'Capturas verificables con hashes locales. No son firmas del proveedor.' \
              'No contienen balances personales ni datos de cuentas.' \
              'Reconstruir usando tools/ciclo-financiero.mjs recuperar.' > README.md
          fi
          mkdir -p capturas
          cp -a "$RUNNER_TEMP/ef002/archivo/." capturas/
          git add -- capturas README.md
          if ! git diff --cached --quiet; then
            git commit -m "data(EF002): captura financiera publica punto-en-tiempo"
            git push origin HEAD:refs/heads/laplace-archivo
          else
            echo "EF002: archivo identico ya registrado"
          fi
