name: Entidad Laplace EF001 - Estado financiero mundial
on:
  push:
    branches: [feature/ef001-mundo-financiero-estados-20261031]
  pull_request:
    paths:
      - 'estado-financiero/**'
      - 'input/**'
      - 'tests/estado-financiero.test.mjs'
      - 'package.json'
      - '.github/workflows/ef001.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  financial-world-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias congeladas
        run: npm ci --no-audit --no-fund
      - name: Sintaxis de EF001 e integracion I001
        run: |
          set -euo pipefail
          node --check input/almacen.mjs
          node --check estado-financiero/modelo.mjs
          node --check estado-financiero/repositorio.mjs
          node --check tools/estado-financiero.mjs
          node --check tests/estado-financiero.test.mjs
      - name: Contrato temporal y PGlite real
        run: npm run test:ef001
      - name: Regresiones de entrada y prediccion
        run: |
          set -euo pipefail
          npm run test:input
          npm run test:v001
          npm run test:fusion
          node --test tests/global-u003.test.mjs tests/seguimiento.test.mjs
      - name: Recuperar runtime original XI/Ether fijado por commit
        uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: 3d29556eff4d1079c791abab38e203fc209f1722
          path: deps/mundo-X
          persist-credentials: false
      - name: Compilar motor XI/Ether original
        run: |
          set -euo pipefail
          test "$(git -C deps/mundo-X rev-parse HEAD)" = 3d29556eff4d1079c791abab38e203fc209f1722
          cmake -S deps/mundo-X/quantum-runtime -B build-ether -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ether --target mundo_x_quantum --parallel 2
      - name: Proyeccion EF001 en XI/Ether original
        env:
          MUNDO_X_QUANTUM: ./build-ether/mundo_x_quantum
        run: npm run test:ef001
      - name: Migracion real repetible sin cambiar entrada existente
        run: |
          set -euo pipefail
          mkdir -p /tmp/ef001-audit
          node tools/estado-financiero.mjs migrar /tmp/ef001-audit/db
          node tools/estado-financiero.mjs migrar /tmp/ef001-audit/db
